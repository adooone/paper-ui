name: Publish

on:
  release:
    types: [published]

# Trusted publishing: npm trusts this repository's publish.yml through OIDC, so the
# job mints its own short-lived credential and no npm token can expire on us again.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # Trusted publishing needs npm 11.5+; Node 22 bundles npm 10. No registry-url on
      # setup-node either: its placeholder auth token would be sent instead of the OIDC exchange.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public --provenance
